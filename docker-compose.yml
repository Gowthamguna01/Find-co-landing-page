
services:
    app:
        build:
            context: .
            dockerfile: docker/fpm/dev/Dockerfile
        networks:
            - pixalto
        depends_on:
            - mysql
            - redis
            - soketi
        environment:
            PHP_POOL_NAME: "app"
            PHP_DATE_TIMEZONE: "Asia/Kolkata"
        volumes:
            - ./:/var/www/html
            - ./docker/fpm/dev/php.ini:/usr/local/etc/php/php.ini
        env_file:
            - .env
    web:
        image: caddy/caddy:alpine
        networks:
            - pixalto
        volumes:
            - ./docker/caddy/dev/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./:/var/www/html
            - caddy_data:/data
        ports:
            - "80:80"
        depends_on:
            - app
    mysql:
        image: mysql:latest
        networks:
            - pixalto
        volumes:
            - mysql:/var/lib/mysql
        environment:
            - "MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}"
            - "MYSQL_DATABASE=${DB_DATABASE}"
            - "MYSQL_USER=${DB_USERNAME}"
            - "MYSQL_PASSWORD=${DB_PASSWORD}"
            - TZ=Asia/Kolkata
        ports:
            - "3306:3306"
        expose:
            - 3306
        env_file:
            - .env

        #laravel cron
    cron:
        build:
            context: .
            dockerfile: docker/cli/Dockerfile
        networks:
            - pixalto
        command: ["php", "/var/www/html/artisan", "schedule:work"]
        volumes:
            - ./:/var/www/html
        depends_on:
            - app
        environment:
            - "PHP_POOL_NAME=task"
            - "BEANSTALKD_HOST=queue"
            - "QUEUE_DRIVER=beanstalkd"
            - "PHP_OPCACHE_ENABLE=1"
        env_file:
            - .env

    worker:
        build:
            context: .
            dockerfile: docker/cli/Dockerfile
        networks:
            - pixalto
        command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3"]
        volumes:
            - ./:/var/www/html
        depends_on:
            - app
        environment:
            - "PHP_POOL_NAME=task"
        env_file:
            - .env

    redis:
        image: redis:5.0-alpine
        networks:
            - pixalto
        command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        ports:
            - "6379:6379"
        env_file:
            - .env

    soketi:
        image: 'quay.io/soketi/soketi:1.4-16-debian'
        ports:
            - '${SOKETI_PORT:-6001}:6001'
            - '${SOKETI_METRICS_SERVER_PORT:-9601}:9601'
        environment:
            - "SOKETI_DEFAULT_APP_ID=${PUSHER_APP_ID}"
            - "SOKETI_DEFAULT_APP_KEY=${PUSHER_APP_KEY}"
            - "SOKETI_DEFAULT_APP_SECRET=${PUSHER_APP_SECRET}"
            - SOKETI_DEBUG='1'
        env_file:
            - .env
        networks:
            - pixalto


    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - pixalto

volumes:
    mysql:
    caddy_data:

networks:
    pixalto:
        driver: bridge
